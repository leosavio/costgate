name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub release
      id-token: write # cosign keyless signature (Sigstore, GitHub OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: test
        run: go test -race -count=1 ./...

      - name: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG" in v[0-9]*) ;; *) echo "unexpected tag $TAG"; exit 1 ;; esac
          version="${TAG#v}"
          mtime="$(git log -1 --format=%cI)"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            work="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -buildid= -X main.version=${version}" -o "$work/costgate" ./cmd/costgate
            cp LICENSE README.md "$work/"
            tar --sort=name --mtime="$mtime" --owner=0 --group=0 --numeric-owner \
              -C "$work" -czf "dist/costgate_${version}_${os}_${arch}.tar.gz" costgate LICENSE README.md
          done
          (cd dist && sha256sum costgate_*.tar.gz > checksums.txt && cat checksums.txt)

      - name: sign checksums (cosign keyless)
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file - <<'EOF'
          Binaries for darwin/linux on arm64/amd64. Verify before use:

          ```sh
          cosign verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp '^https://github.com/leosavio/costgate/.github/workflows/release.yml@refs/tags/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
          sha256sum -c --ignore-missing checksums.txt
          ```
          EOF

      # Pushes Formula/costgate.rb to leosavio/homebrew-tap with a deploy key
      # that can write only to that repository.
      - name: update Homebrew tap
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          case "$version" in *-*) echo "pre-release $version: tap not updated"; exit 0 ;; esac
          if [ -z "$TAP_KEY" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY not set; run scripts/homebrew-formula.sh and update the tap by hand"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_KEY" > "$key"
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes"
          git clone -q git@github.com:leosavio/homebrew-tap.git "$RUNNER_TEMP/tap"
          sh scripts/homebrew-formula.sh "$version" dist/checksums.txt > "$RUNNER_TEMP/tap/Formula/costgate.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "formula unchanged"; rm -f "$key"; exit 0; fi
          git commit -qam "feat: costgate ${version}"
          git push -q origin main
          rm -f "$key"
