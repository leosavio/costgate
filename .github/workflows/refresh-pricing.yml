name: refresh-pricing

# Weekly: download the public Price List Bulk API files (no AWS credential),
# rebuild the embedded snapshot of every region (pricing/<region>.json.gz,
# scripts/refresh-all.sh, which keeps the file of a region whose prices did
# not change) and open a PR only when a price changed. A refresh that changes
# only as_of, sha256 or the offer file versions opens nothing
# (scripts/pricing-diff.sh compares the "prices" maps; a rule change shows up
# there as added or removed keys). us-east-1 is refreshed with --strict: a
# pricing rule without a price there means the offer format changed.
# Every refresh uses one rolling branch, pricing/refresh, owned by the bot:
# it is rewritten (force push) on each run and its open PR is updated, so a
# reviewer finds one PR with the latest prices. Do not push to it by hand.
# Requires "Allow GitHub Actions to create and approve pull requests" in the
# repository settings. A PR opened with GITHUB_TOKEN creates the ci run in an
# approval-required state: approve it from the PR merge box before merging
# (https://docs.github.com/en/actions/concepts/security/github_token, "When
# GITHUB_TOKEN triggers workflow runs").
#
# dry_run_pr (manual only) proves the PR path without touching main or the
# real snapshots: it adds pricing/test-marker.txt on a throwaway
# branch, opens a PR labelled pricing-refresh-test, checks that
# github-actions[bot] authored it and that the ci run waits for approval,
# then closes the PR and deletes the branch in the same run (also on
# failure). The ci run of the test PR can no longer resolve its ref once the
# branch is gone and ends as a failure with no jobs, so the cleanup-test-run
# job deletes it.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run_pr:
        description: "Open and close a marked test PR instead of a real refresh PR"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh-pricing
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # push the refresh branch (and delete the test branch)
      pull-requests: write # open or update the PR (and close the test PR)
      actions: read # dry run: read the ci run the test PR creates
    outputs:
      test_branch: ${{ steps.pr.outputs.branch }}
    env:
      DRY_RUN: ${{ inputs.dry_run_pr && 'true' || 'false' }}
      TEST_LABEL: pricing-refresh-test
      BRANCH: pricing/refresh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: refresh every region
        run: |
          set -eu
          go build -o "$RUNNER_TEMP/costgate" ./cmd/costgate
          COSTGATE="$RUNNER_TEMP/costgate" JOBS=4 bash scripts/refresh-all.sh
          # The binary embeds the old snapshots: verify every file explicitly.
          for f in pricing/*.json.gz; do
            "$RUNNER_TEMP/costgate" pricing verify --region "$(basename "$f" .json.gz)" --pricing "$f" >/dev/null
          done

      - name: test with the new snapshots
        run: go test -count=1 ./...

      - name: compare prices
        id: cmp
        run: |
          set -eu
          rc=0
          sh scripts/pricing-diff.sh HEAD > "$RUNNER_TEMP/price-diff.md" || rc=$?
          cat "$RUNNER_TEMP/price-diff.md"
          case "$rc" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no price changed; no PR" >> "$GITHUB_STEP_SUMMARY" ;;
            1) echo "changed=true" >> "$GITHUB_OUTPUT"; cat "$RUNNER_TEMP/price-diff.md" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "pricing-diff failed ($rc)"; exit 1 ;;
          esac

      # Synthetic, marked change. Applied after the tests, only on the test
      # branch; the PR is never merged.
      # The snapshots are gzip, so the PR diff cannot show a marker inside
      # them: the dry run adds a text file next to them (not embedded).
      - name: mark snapshot (dry run)
        if: env.DRY_RUN == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          printf 'test_marker: refresh-pricing dry run %s; do not merge\n' "$RUN_ID" > pricing/test-marker.txt
          git status --short -- pricing/

      - name: open or update the refresh PR
        id: pr
        if: steps.cmp.outputs.changed == 'true' || env.DRY_RUN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          if [ "$DRY_RUN" = true ]; then
            branch="pricing/refresh-test-${RUN_ID}"
            title="test(pricing): dry run of the refresh PR (run ${RUN_ID}), do not merge"
            body="Opened by refresh-pricing.yml with dry_run_pr=true to prove the PR path. It adds pricing/test-marker.txt next to the snapshots, a synthetic change. The same run closes this PR and deletes the branch."
            label_args="--label ${TEST_LABEL}"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then echo "$branch exists"; exit 1; fi
          else
            branch="$BRANCH"
            title="chore(pricing): refresh embedded price snapshots"
            body="$(printf 'Automatic refresh from the public AWS Price List Bulk API (run %s). Prices that changed, by region:\n\n%s\n\nThis branch is rewritten by every refresh that finds a price change; review the price diff before merging.' "$RUN_ID" "$(cat "$RUNNER_TEMP/price-diff.md")")"
            label_args=""
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add pricing/
          git commit -m "$title"
          if [ "$DRY_RUN" = true ]; then
            git push origin "$branch"
          else
            # The rolling branch belongs to this workflow: replace its content.
            git push --force origin "$branch"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          url="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json url --jq '.[0].url // ""')"
          if [ -n "$url" ]; then
            gh pr edit "$url" --title "$title" --body "$body"
            echo "updated $url"
          else
            # shellcheck disable=SC2086 # label_args is empty or two words
            url="$(gh pr create --base main --head "$branch" --title "$title" --body "$body" $label_args)"
            echo "opened $url"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: verify test PR (dry run)
        if: env.DRY_RUN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.pr.outputs.url }}
        run: |
          set -eu
          [ -n "$URL" ] || { echo "no PR was opened"; exit 1; }
          n="${URL##*/}"
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${n}")"
          author="$(echo "$pr" | jq -r .user.login)"
          labels="$(echo "$pr" | jq -r '[.labels[].name] | join(",")')"
          base="$(echo "$pr" | jq -r .base.ref)"
          echo "PR #$n author=$author labels=$labels base=$base"
          [ "$author" = "github-actions[bot]" ] || { echo "author is $author"; exit 1; }
          [ "$labels" = "$TEST_LABEL" ] || { echo "labels are $labels"; exit 1; }
          [ "$base" = main ] || { echo "base is $base"; exit 1; }
          gh pr diff "$n" --repo "$GITHUB_REPOSITORY" | grep -q '^+test_marker: ' || { echo "marker not in PR diff"; exit 1; }
          echo "### dry run PR: $URL (author $author, label $labels)" >> "$GITHUB_STEP_SUMMARY"
          # The ci run of a PR opened with GITHUB_TOKEN waits for approval.
          # Record what GitHub created; do not fail the proof on it.
          head_sha="$(echo "$pr" | jq -r .head.sha)"
          run=""
          for _ in $(seq 1 12); do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&head_sha=${head_sha}" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")][0] | select(.) | "\(.id) status=\(.status) conclusion=\(.conclusion)"')"
            [ -n "$run" ] && break
            sleep 5
          done
          echo "ci run of the test PR: ${run:-none after 60 s}"
          echo "ci run of the test PR: ${run:-none after 60 s}" >> "$GITHUB_STEP_SUMMARY"

      - name: close test PR and delete branch (dry run)
        if: always() && env.DRY_RUN == 'true' && steps.pr.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.pr.outputs.url }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -eu
          if [ -n "$URL" ]; then
            gh pr close "$URL" --comment "Dry run finished; closing." || true
          fi
          git push origin --delete "$BRANCH"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then echo "branch $BRANCH still exists"; exit 1; fi
          if [ -n "$URL" ]; then
            state="$(gh pr view "$URL" --json state --jq .state)"
            [ "$state" = CLOSED ] || { echo "PR state $state"; exit 1; }
          fi
          echo "closed $URL, deleted $BRANCH"

  # Deletes the ci run of the test PR, so a dry run leaves no red run behind.
  # Separate job: only it holds actions: write, and only for the test branch.
  cleanup-test-run:
    needs: refresh
    if: always() && inputs.dry_run_pr && needs.refresh.outputs.test_branch != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write # delete the ci run of the test PR
    env:
      BRANCH: ${{ needs.refresh.outputs.test_branch }}
    steps:
      - name: delete the ci run of the test PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case "$BRANCH" in pricing/refresh-test-[0-9]*) ;; *) echo "refusing branch $BRANCH"; exit 1 ;; esac
          list() {
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&branch=${BRANCH}" \
              --jq '.workflow_runs[] | select(.path == ".github/workflows/ci.yml") | "\(.id) \(.status) \(.conclusion)"'
          }
          # Wait until the run exists and every run of the branch is
          # completed; GitHub refuses to delete a run in progress.
          runs=""
          for _ in $(seq 1 36); do
            runs="$(list)"
            if [ -n "$runs" ] && ! echo "$runs" | grep -qv ' completed '; then break; fi
            sleep 5
          done
          echo "runs of $BRANCH: ${runs:-none}"
          [ -n "$runs" ] || exit 0
          echo "$runs" | while read -r id status conclusion; do
            [ "$status" = completed ] || { echo "run $id still $status"; exit 1; }
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}"
            echo "deleted run $id ($conclusion)"
            echo "deleted ci run $id of the test PR ($conclusion)" >> "$GITHUB_STEP_SUMMARY"
          done
          [ -z "$(list)" ] || { echo "runs left: $(list)"; exit 1; }
